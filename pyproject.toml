[project]
name = "tabularius"
version = "1.0.0"
description = "Tabularius — Hermes MemoryProvider plugin: extract, index, and recall conversation memory as markdown"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "LaiTszKin", email = "laitszkin1206@gmail.com" }]
dependencies = [
    "openai>=1.0",
    "pydantic>=2",
    "httpx>=0.27",
    "json-repair>=0.20",
    "fabricium>=0.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "mypy>=1.16",
    "pre-commit>=4",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tabularius"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src/tabularius"]
mypy_path = ["stubs"]
