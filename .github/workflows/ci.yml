name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Type check (mypy strict)
        run: uv run mypy

      - name: Tests
        run: uv run pytest tests/ -q

  e2e:
    name: e2e (Docker)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --dev

      # The e2e conftest skips the suite when the base image is absent, so
      # pre-pull it — this is what the suite's _docker_ready() checks.
      - name: Pull hermes-agent base image
        run: docker pull nousresearch/hermes-agent:latest

      - name: Docker E2E tests (L1–L3 offline; L4 needs TABULARIUS_API_KEY)
        env:
          TABULARIUS_API_KEY: ${{ secrets.TABULARIUS_API_KEY }}
        run: uv run pytest tests/e2e/ -q
