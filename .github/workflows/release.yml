name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  # Manual recovery path: a missed tag-push run can be re-triggered without
  # deleting and re-pushing the tag (see github-release-workflow skill).
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Type check (mypy strict)
        run: uv run mypy

      - name: Tests (Docker e2e skips without docker)
        run: uv run pytest tests/ -q

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: test
    permissions:
      id-token: write # PyPI trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      # github.ref_name is 'main' during workflow_dispatch — fall back to the
      # tag input so the version still resolves to the released tag.
      - name: Extract version from tag
        id: version
        run: |
          REF_NAME="${{ github.event.inputs.tag || github.ref_name }}"
          echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify pyproject.toml version matches tag
        run: |
          PYP_VERSION="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)"
          if [ "$PYP_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::pyproject.toml version ($PYP_VERSION) does not match tag version (${{ steps.version.outputs.version }})"
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build

      # Trusted publishing: no username/password/token. The action exchanges
      # the OIDC id-token for a PyPI API token bound to this workflow.
      # Requires a PyPI trusted publisher for project "tabularius" /
      # workflow "release.yml" (see PyPI → Publishing → Add publisher).
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Extract version from tag
        id: version
        run: |
          REF_NAME="${{ github.event.inputs.tag || github.ref_name }}"
          echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          VERSION="${{ steps.version.outputs.version }}"
          # Dots are regex metacharacters — escape them before embedding.
          VERSION_RE="$(echo "$VERSION" | sed 's/\./\\./g')"
          # Flag-based extraction (never the /start/,/end/ range pattern):
          # match the version header, skip it, print until the next header.
          awk '/^## \['"$VERSION_RE"'\]/{flag=1; next} /^## \[/{flag=0} flag' \
            CHANGELOG.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "Release $TAG" > /tmp/release-notes.md
          fi
          # Idempotent: a re-run (workflow_dispatch recovery) for a tag that
          # already has a release must not fail with HTTP 422 "tag_name
          # already exists".
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — skipping creation"
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file /tmp/release-notes.md \
              --verify-tag
          fi
